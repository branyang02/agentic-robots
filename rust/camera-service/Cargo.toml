[package]
name = "robot-camera-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1"
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
v4l = "0.14"
