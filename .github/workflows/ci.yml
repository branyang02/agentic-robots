name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install camera build and test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ffmpeg libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Rust format
        run: cargo fmt --manifest-path rust/camera-service/Cargo.toml --check
      - name: Rust type check
        run: cargo check --locked --all-targets --manifest-path rust/camera-service/Cargo.toml
      - name: Rust lint
        run: cargo clippy --locked --all-targets --manifest-path rust/camera-service/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path rust/camera-service/Cargo.toml
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
